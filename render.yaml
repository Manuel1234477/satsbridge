# Render Blueprint for the backend (demo setup: mock collections and payouts, settlement on
# Stellar testnet). Run `cargo run --bin stellar_setup` locally first and paste its keys below.
# Render > New > Blueprint > pick this repo, then fill in the variables marked sync: false.
services:
  - type: web
    name: stellarbridge-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free # no persistent disk on the free plan: the SQLite database resets on every deploy and restart
    healthCheckPath: /api/v1/health
    envVars:
      - key: MOCK_PAYOUTS
        value: "true"
      # Demo only: mounts the mock deposit/payout/refund simulators so test payments can be completed.
      - key: DEV_ROUTES
        value: "true"
      # HMAC secret for /api/v1/webhooks/provider and /webhooks/collections. Required.
      - key: PROVIDER_WEBHOOK_SECRET
        generateValue: true
      # Bearer token for /api/v1/admin/*. Admin routes are disabled when empty.
      - key: ADMIN_API_KEY
        generateValue: true
      - key: STELLAR_LEDGER
        value: testnet
      # From `cargo run --bin stellar_setup` (testnet keys only).
      - key: STELLAR_ISSUER_SECRET
        sync: false
      - key: STELLAR_TREASURY_SECRET
        sync: false
      - key: MOCK_COLLECTIONS
        value: "true"
      # This service's public URL, e.g. https://stellarbridge-api.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false
      # Origin of the deployed web app, e.g. https://stellarbridge.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
